name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "inference_worker/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "run_frozen.py"
      - "favicon.ico"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "inference_worker/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "run_frozen.py"
      - "favicon.ico"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      create_draft: ${{ steps.release.outputs.create_draft }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate lock and release identity
        id: release
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("project version must be stable semantic version")
          ref = os.environ["GITHUB_REF"]
          tag = os.environ.get("GITHUB_REF_NAME", "") if ref.startswith("refs/tags/") else ""
          if tag and tag.removeprefix("v") != version:
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          print(f"tag={tag}")
          print(f"version={version}")
          print(f"create_draft={'true' if tag else 'false'}")
          PY
          test -f uv.lock || {
            echo "uv.lock is required for binary releases" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            binary: dist/grid-inference-worker.exe
            release_file: dist/grid-inference-worker-windows-x64.exe
          - os: ubuntu-22.04
            target: linux-x64
            binary: dist/grid-inference-worker
            release_file: dist/grid-inference-worker-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: dist/grid-inference-worker
            release_file: dist/grid-inference-worker-linux-arm64
          - os: macos-14
            target: macos-arm64
            binary: dist/grid-inference-worker.app
            release_file: dist/grid-inference-worker-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked dependencies and test
        run: |
          uv sync --frozen --extra build --extra test --python 3.11
          uv run --frozen --extra build --extra test pytest -q
          uv run --frozen --extra build python -m compileall -q inference_worker
      - name: Generate platform icons
        run: uv run --frozen --extra build python scripts/make_icon.py
      - name: Build binary
        shell: bash
        run: |
          SEP=":"
          PLATFORM_ARGS=()
          MODE_ARGS=(--onefile)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
            PLATFORM_ARGS=(--noconsole --icon favicon.ico --manifest scripts/app.manifest)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            MODE_ARGS=()
            PLATFORM_ARGS=(--windowed --icon icon.icns)
          fi
          uv run --frozen --extra build pyinstaller --clean --noconfirm \
            "${MODE_ARGS[@]}" --noupx --name grid-inference-worker \
            --add-data "inference_worker/web/templates${SEP}inference_worker/web/templates" \
            --add-data "inference_worker/web/static${SEP}inference_worker/web/static" \
            --add-data "favicon.ico${SEP}." \
            --hidden-import inference_worker.env_utils \
            --hidden-import inference_worker.service \
            --hidden-import inference_worker.gui \
            --hidden-import inference_worker.headless \
            --hidden-import inference_worker.web.routes \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            "${PLATFORM_ARGS[@]}" run_frozen.py
      - name: Smoke-test and inspect bundle
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            dist/grid-inference-worker.app/Contents/MacOS/grid-inference-worker --help
            ARCHIVE=dist/grid-inference-worker.app/Contents/MacOS/grid-inference-worker
          else
            "$BINARY" --help
            ARCHIVE="$BINARY"
          fi
          uv run --frozen --extra build pyi-archive_viewer -l "$ARCHIVE" > archive.txt
          if grep -Eiq '(^|[ /._-])(\.env|id_rsa|private[-_]?key|proxmox|credentials)([ /._-]|$)' archive.txt; then
            echo "Sensitive or operational material is present in the bundle" >&2
            exit 1
          fi
      - name: Stage release artifact
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          RELEASE_FILE: ${{ matrix.release_file }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/grid-inference-worker.app "dist/Grid Inference Worker.app"
            (
              cd dist
              python -m zipfile -c grid-inference-worker-macos-arm64.zip "Grid Inference Worker.app"
            )
          else
            cp "$BINARY" "$RELEASE_FILE"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grid-inference-worker-${{ matrix.target }}
          path: ${{ matrix.release_file }}
          if-no-files-found: error

  bundle:
    name: Assemble verified release payload
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: grid-inference-worker-*
          path: release-assets
          merge-multiple: true
      - name: Generate SPDX release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/grid-inference-worker-release.spdx.json
          artifact-name: grid-inference-worker-release-sbom
      - name: Build release manifest and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("release-assets")
          names = [
              "grid-inference-worker-linux-x64",
              "grid-inference-worker-linux-arm64",
              "grid-inference-worker-macos-arm64.zip",
              "grid-inference-worker-windows-x64.exe",
              "grid-inference-worker-release.spdx.json",
          ]
          assets = []
          for name in names:
              path = root / name
              assets.append({
                  "name": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              })
          manifest = {
              "schema": "aipg-text-worker-release-v1",
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
              "commit": os.environ["RELEASE_COMMIT"],
              "assets": assets,
          }
          (root / "worker-release.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          checksummed = [*names, "worker-release.json"]
          lines = [
              f"{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}"
              for name in checksummed
          ]
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
      - name: Verify complete release payload
        run: python scripts/verify-release-assets.py release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grid-inference-worker-release-payload
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft release
    if: ${{ needs.validate.outputs.create_draft == 'true' }}
    needs: [validate, bundle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Upload the verified payload to a draft GitHub release.
      id-token: write # Exchange the workflow identity for a provenance certificate.
      attestations: write # Publish provenance attestations for release assets.
      artifact-metadata: write # Associate attestations with uploaded artifacts.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: grid-inference-worker-release-payload
          path: release-assets
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          assets=(release-assets/*)
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to overwrite a published release" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "${assets[@]}" \
              --draft --verify-tag \
              --title "Grid Text Worker ${RELEASE_TAG#v}" \
              --notes "Draft only: publish after platform signing and supervised staging validation."
          fi
