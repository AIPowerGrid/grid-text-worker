name: Build Binaries

on:
  push:
    # Match both "v1.2.3" and bare "1.2.3" tags — releases here are cut as
    # bare semver (e.g. 0.1.0), which "v*" alone would never trigger on.
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller pillow

      - name: Generate icon
        run: python scripts/make_icon.py

      - name: Build binary
        shell: bash
        run: |
          SEP=":"
          PLATFORM_ARGS=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
            PLATFORM_ARGS="--noconsole --icon favicon.ico --manifest scripts/app.manifest"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            PLATFORM_ARGS="--windowed --icon icon.icns"
          fi

          python -m PyInstaller --onefile --noupx --name grid-inference-worker \
            --add-data "inference_worker/web/templates${SEP}inference_worker/web/templates" \
            --add-data "inference_worker/web/static${SEP}inference_worker/web/static" \
            --add-data "favicon.ico${SEP}." \
            --hidden-import inference_worker.env_utils \
            --hidden-import inference_worker.service \
            --hidden-import inference_worker.gui \
            --hidden-import inference_worker.headless \
            --hidden-import inference_worker.web.routes \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            $PLATFORM_ARGS \
            run_frozen.py

      - name: Package binary
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv grid-inference-worker.exe "grid-inference-worker-${{ matrix.target }}.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv grid-inference-worker.app "Grid Inference Worker.app"
            zip -r "grid-inference-worker-${{ matrix.target }}.zip" "Grid Inference Worker.app"
          else
            mv grid-inference-worker "grid-inference-worker-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-inference-worker-${{ matrix.target }}
          path: |
            dist/grid-inference-worker-${{ matrix.target }}*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/grid-inference-worker-*
