name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install package + test extras
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --frozen --extra test --python "$PYTHON_VERSION"

      - name: Reject retired transports
        shell: bash
        run: |
          if git grep -nEi 'AI[ -]?Horde|/api/v2|/v2/generate|GRID_STREAMING=' -- . \
            ':(exclude).github/workflows/test.yml'; then
            echo "::error::retired transport reference found above"
            exit 1
          fi

      - name: Run test suite
        run: uv run --frozen --extra test pytest tests/ -v --tb=short

  dependency-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Export the complete locked dependency graph
        run: >-
          uv export --frozen --all-extras --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/text-worker-all-deps.txt

      - name: Audit locked dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r /tmp/text-worker-all-deps.txt --require-hashes --disable-pip

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build locked worker image
        run: docker build -t aipowergrid/text-worker:ci .

      - name: Smoke-test worker image
        run: docker run --rm aipowergrid/text-worker:ci grid-inference-worker --help
